name: C++ CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
            cc: gcc
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
            cc: clang
          - os: macos-latest
            compiler: apple-clang
            cxx: clang++
            cc: clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DGRAFITE_BUILD_TESTS=ON
          -DGRAFITE_BUILD_EXAMPLES=ON

      - name: Build core, tests, and examples
        run: cmake --build build --parallel 2

      - name: Run deterministic software tests
        run: ctest --test-dir build --output-on-failure
